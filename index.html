:root{--navy:#0B1F3A;--bg:#f6f8fc;--line:#e4e9f2;--muted:#5b6b82;--ink:#1a2233}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
.demo{background:#F5A623;color:#3a2a00;text-align:center;font-size:12px;font-weight:700;padding:6px}
header{background:linear-gradient(135deg,#0B1F3A,#12294d);color:#fff;padding:18px 24px;display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#F5A623,#ffcf6b);display:flex;align-items:center;justify-content:center;font-size:20px}
header h1{font-size:18px}header h1 span{color:#F5A623}
header .sub{color:#a9bdd9;font-size:12px}
.wrap{max-width:1200px;margin:0 auto;padding:20px 24px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.kpi .n{font-size:24px;font-weight:800;color:var(--navy)}
.kpi .l{font-size:12px;color:var(--muted);margin-top:2px}
.kpi .n.verde{color:#00B389}.kpi .n.amber{color:#d98b0e}
.funil{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.pill{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:100px;padding:6px 13px;font-size:12.5px}
.dot{width:9px;height:9px;border-radius:50%}
.grid{display:grid;grid-template-columns:1fr 1.1fr;gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card h2{font-size:13px;padding:12px 16px;border-bottom:1px solid var(--line);color:var(--navy)}
.lista{max-height:70vh;overflow:auto}
.row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--bg)}.row.sel{background:#eef3ff}
.row .nome{font-weight:600;flex:1}
.row .val{font-weight:700;color:var(--navy)}
.badge{font-size:10.5px;font-weight:700;color:#fff;padding:2px 8px;border-radius:100px;white-space:nowrap}
.meta{font-size:11px;color:var(--muted)}
.chat{padding:16px;max-height:70vh;overflow:auto;background:#f0f2f7}
.chat .empty{color:var(--muted);text-align:center;padding:40px 0}
.msg{max-width:78%;padding:8px 12px;border-radius:12px;margin-bottom:8px;font-size:13px;line-height:1.4;white-space:pre-wrap;word-break:break-word}
.msg.saida{background:#dcf8c6;margin-left:auto;border-bottom-right-radius:3px}
.msg.entrada{background:#fff;border:1px solid var(--line);border-bottom-left-radius:3px}
.msg .h{font-size:10px;color:var(--muted);margin-bottom:2px}
@media(max-width:820px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}

const brl=n=>Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
let sel=null;
function estBadge(e){const x=EST[e]||{rot:e,cor:'#5b6b82'};return '<span class="badge" style="background:'+x.cor+'">'+x.rot+'</span>';}
function kpi(n,l,cls){return '<div class="kpi"><div class="n '+(cls||'')+'">'+n+'</div><div class="l">'+l+'</div></div>';}
function render(){
  const r=DADOS.resumo;
  document.getElementById('kpis').innerHTML=
   kpi(r.total,'devedores na carteira')+
   kpi('R$ '+brl(r.carteira),'valor em aberto')+
   kpi('R$ '+brl(r.recuperado),'acordo fechado/pago','verde')+
   kpi((r.total?Math.round(100*(DADOS.devedores.filter(d=>d.estado==='PAGO').length)/r.total):0)+'%','quitados','amber');
  const cont={};DADOS.devedores.forEach(d=>cont[d.estado]=(cont[d.estado]||0)+1);
  document.getElementById('funil').innerHTML=Object.entries(cont).sort((a,b)=>b[1]-a[1])
   .map(([e,n])=>'<div class="pill"><span class="dot" style="background:'+((EST[e]||{}).cor||'#888')+'"></span>'+((EST[e]||{}).rot||e)+' <b>'+n+'</b></div>').join('');
  document.getElementById('lista').innerHTML=DADOS.devedores.map(d=>
   '<div class="row'+(sel===d.id?' sel':'')+'" onclick="abrir('+d.id+')"><div><div class="nome">'+d.nome+'</div>'+
   '<div class="meta">'+(d.credor||'')+(d.parcelas>1?' · '+d.parcelas+'x':'')+'</div></div>'+
   '<div style="text-align:right"><div class="val">R$ '+brl(d.valor_acordo||d.valor)+'</div>'+estBadge(d.estado)+'</div></div>').join('');
}
function abrir(id){sel=id;const d=DADOS.devedores.find(x=>x.id===id);
  document.getElementById('chatTit').textContent='Conversa — '+d.nome;
  const c=document.getElementById('chat');
  c.innerHTML=d.mensagens.length?d.mensagens.map(m=>
   '<div class="msg '+m.direcao+'"><div class="h">'+(m.direcao==='saida'?'Marina 🤖':d.nome.split(' ')[0])+'</div>'+
   m.texto.replace(/</g,'&lt;')+'</div>').join(''):'<div class="empty">Sem mensagens</div>';
  render();c.scrollTop=0;
}
render();
</script></body></html>
